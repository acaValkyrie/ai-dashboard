[package]
name = "ai-dashboard"
version = "0.1.0"
description = "Local Claude Code and Codex CLI usage dashboard"
authors = ["acaValkyrie"]
edition = "2021"

[lib]
name = "ai_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
portable-pty = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-mcp-bridge = "0.13"
walkdir = "2"
